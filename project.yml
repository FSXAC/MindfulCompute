name: MindfulCompute
options:
  bundleIdPrefix: ca.muchen
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
targets:
  MindfulCompute:
    type: application
    platform: macOS
    sources:
      - path: MindfulCompute
      - path: assets/sounds
        buildPhase: resources
      - path: assets/AppIcon.icns
        buildPhase: resources
    info:
      path: MindfulCompute/Info.plist
      properties:
        LSUIElement: true
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Muchen He
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.muchen.MindfulCompute
        MARKETING_VERSION: "1.2.2"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # Hardened runtime blocks DYLD injection into an always-running login
        # item that takes keystrokes; it costs nothing for local ad-hoc use.
        ENABLE_HARDENED_RUNTIME: YES
