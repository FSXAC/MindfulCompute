name: MindfulCompute
options:
  bundleIdPrefix: ca.muchen
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
targets:
  MindfulCompute:
    type: application
    platform: macOS
    sources:
      - path: MindfulCompute
      - path: assets/sounds
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.muchen.MindfulCompute
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Muchen He"
